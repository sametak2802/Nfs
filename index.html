var SIDEWALK = 3.4;
var WALL = HW + SIDEWALK;
var scene = new THREE.Scene();
var TRACK = null;

function buildTrackData() {
  var pts = THEME.pts.map(function (p) { return new THREE.Vector3(p[0], 0, p[1]); });
  var curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
  var len = curve.getLength(), N = Math.round(len / 3);
  var sp = curve.getSpacedPoints(N);
  var ds = len / N, S = [], i;
  for (i = 0; i < N; i++) {
    var s = i * ds;
    var y = THEME.elev(s, len);
    S.push({ x: sp[i].x, y: y, z: sp[i].z, s: s });
  }
  // yol düzlüğü için başlangıç düzlüğünü yumuşat
  for (i = 0; i < N; i++) {
    var a = S[(i - 1 + N) % N], b = S[(i + 1) % N], c = S[i];
    var tx = b.x - a.x, tz = b.z - a.z, tl = Math.hypot(tx, tz);
    c.tx = tx / tl; c.tz = tz / tl;
    c.rx = -c.tz; c.rz = c.tx;               // sağ vektör
    c.heading = Math.atan2(c.tx, c.tz);
    c.slope = (b.y - a.y) / (2 * ds);
  }
  for (i = 0; i < N; i++) {
    var p0 = S[(i - 4 + N) % N], p1 = S[(i + 4) % N];
    S[i].k = wrapAngle(p1.heading - p0.heading) / (8 * ds);   // eğrilik (işaretli)
  }
  // yapay zekâ hız profili
  var vmax = [];
  for (i = 0; i < N; i++) {
    var ks = 0;
    for (var j = -6; j <= 6; j++) ks += Math.abs(S[(i + j + N) % N].k);
    ks /= 13;
    vmax.push(Math.min(72, Math.sqrt(24 / Math.max(ks, 1e-4))));
  }
  for (var pass = 0; pass < 2; pass++) {
    for (i = N - 1; i >= 0; i--) {
      var nx = vmax[(i + 1) % N];
      vmax[i] = Math.min(vmax[i], Math.sqrt(nx * nx + 2 * 11 * ds));
    }
  }
  // mini harita noktaları
  var minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (i = 0; i < N; i++) { minX = Math.min(minX, S[i].x); maxX = Math.max(maxX, S[i].x); minZ = Math.min(minZ, S[i].z); maxZ = Math.max(maxZ, S[i].z); }
  TRACK = { S: S, N: N, len: len, ds: ds, vmax: vmax, bounds: [minX, maxX, minZ, maxZ] };
}
function trackPoint(s, off) {
  var T = TRACK, f = ((s % T.len) + T.len) % T.len / T.ds, i = Math.floor(f), t = f - i;
  var a = T.S[i % T.N], b = T.S[(i + 1) % T.N];
  var x = lerp(a.x, b.x, t), y = lerp(a.y, b.y, t), z = lerp(a.z, b.z, t);
  var rx = lerp(a.rx, b.rx, t), rz = lerp(a.rz, b.rz, t);
  return { x: x + rx * off, y: y, z: z + rz * off, heading: a.heading + wrapAngle(b.heading - a.heading) * t, slope: lerp(a.slope, b.slope, t), idx: i % T.N, t: t };
}

// --- basit geometri birleştirici ---
function GeoBuf() { this.p = []; this.n = []; this.u = []; }
GeoBuf.prototype.quad = function (a, b, c, d, n, ua, ub, uc, ud) {
  // a-b-c-d saat yönü tersine
  var P = this.p, Nn = this.n, U = this.u;
  [a, b, c, a, c, d].forEach(function (v) { P.push(v[0], v[1], v[2]); Nn.push(n[0], n[1], n[2]); });
  U.push(ua[0], ua[1], ub[0], ub[1], uc[0], uc[1], ua[0], ua[1], uc[0], uc[1], ud[0], ud[1]);
};
GeoBuf.prototype.build = function () {
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(this.u, 2));
  g.computeBoundingSphere();
  return g;
};
function norm3(x, y, z) { var l = Math.hypot(x, y, z) || 1; return [x / l, y / l, z / l]; }

function buildRoadMeshes() {
  var T = TRACK, S = T.S, N = T.N, i;
  var road = new GeoBuf(), walk = new GeoBuf(), curb = new GeoBuf(), wall = new GeoBuf();
  for (i = 0; i < N; i++) {
    var a = S[i], b = S[(i + 1) % N];
    var va = a.s / 20, vb = (i + 1 === N ? T.len : b.s) / 20;
    function P(p, off, h) { return [p.x + p.rx * off, p.y + (h || 0), p.z + p.rz * off]; }
    var up = [0, 1, 0];
    road.quad(P(a, -HW), P(b, -HW), P(b, HW), P(a, HW), up, [0, va], [0, vb], [1, vb], [1, va]);
    for (var sd = -1; sd <= 1; sd += 2) {
      var in0 = HW * sd, out0 = WALL * sd;
            var sA = a.s, sB = (i + 1 === N ? T.len : b.s);
      walk.quad(P(a, in0, 0.16), P(b, in0, 0.16), P(b, out0, 0.16), P(a, out0, 0.16), up, [0, sA / 3.4], [0, sB / 3.4], [1, sB / 3.4], [1, sA / 3.4]);
      curb.quad(P(a, in0, 0), P(b, in0, 0), P(b, in0, 0.16), P(a, in0, 0.16), [-sd * a.rx, 0, -sd * a.rz], [0, sA / 3.4], [0, sB / 3.4], [0.1, sB / 3.4], [0.1, sA / 3.4]);
      wall.quad(P(a, out0, 0), P(b, out0, 0), P(b, out0, 1.15), P(a, out0, 1.15), [-sd * a.rx, 0, -sd * a.rz], [sA / 16, 0], [sB / 16, 0], [sB / 16, 1], [sA / 16, 1]);
    }
  }
  var roadMat = new THREE.MeshStandardMaterial({ map: TEX.road, roughnessMap: TEX.roadRough, roughness: 1.0, metalness: 0.0, envMapIntensity: 0.55, side: THREE.DoubleSide });
  world.add(new THREE.Mesh(road.build(), roadMat));
  world.add(new THREE.Mesh(walk.build(), new THREE.MeshStandardMaterial({ map: TEX.sidewalk, roughness: 0.85, side: THREE.DoubleSide })));
  world.add(new THREE.Mesh(curb.build(), new THREE.MeshStandardMaterial({ color: 0x8a8a86, roughness: 0.8, side: THREE.DoubleSide })));
  world.add(new THREE.Mesh(wall.build(), new THREE.MeshStandardMaterial({ map: TEX.wall, roughness: 0.9, side: THREE.DoubleSide })));
}

function distToTrack(x, z) {
  var S = TRACK.S, best = 1e12;
  for (var i = 0; i < TRACK.N; i += 2) {
    var dx = S[i].x - x, dz = S[i].z - z, d = dx * dx + dz * dz;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}
function addBox(buf, cx, cy, cz, w, h, d, yaw, uvScaleX, uvScaleY) {
  // w: ön cephe genişliği, d: derinlik
  var c = Math.cos(yaw), s = Math.sin(yaw);
  function R(x, y, z) { return [cx + x * c + z * s, cy + y, cz - x * s + z * c]; }
  function Nr(x, z) { return [x * c + z * s, 0, -x * s + z * c]; }
  var hw = w / 2, hd = d / 2, y0 = 0, y1 = h;
  var uw = w / uvScaleX, ud = d / uvScaleX, uh = h / uvScaleY;
  buf.quad(R(-hw, y0, hd), R(hw, y0, hd), R(hw, y1, hd), R(-hw, y1, hd), Nr(0, 1), [0, 0], [uw, 0], [uw, uh], [0, uh]);
  buf.quad(R(hw, y0, -hd), R(-hw, y0, -hd), R(-hw, y1, -hd), R(hw, y1, -hd), Nr(0, -1), [0, 0], [uw, 0], [uw, uh], [0, uh]);
  buf.quad(R(hw, y0, hd), R(hw, y0, -hd), R(hw, y1, -hd), R(hw, y1, hd), Nr(1, 0), [0, 0], [ud, 0], [ud, uh], [0, uh]);
  buf.quad(R(-hw, y0, -hd), R(-hw, y0, hd), R(-hw, y1, hd), R(-hw, y1, -hd), Nr(-1, 0), [0, 0], [ud, 0], [ud, uh], [0, uh]);
  buf.quad(R(-hw, y1, hd), R(hw, y1, hd), R(hw, y1, -hd), R(-hw, y1, -hd), [0, 1, 0], [0.01, 0.01], [0.01, 0.01], [0.01, 0.01], [0.01, 0.01]);
}
function buildCity() {
  var T = TRACK, S = T.S, N = T.N, r = rng(4242);
  var bufs = [new GeoBuf(), new GeoBuf(), new GeoBuf()];
  var placed = [], neonSpots = [];
  var CELL = [[2.0, 3.1], [1.8, 2.9], [2.1, 3.0]];
  for (var side = -1; side <= 1; side += 2) {
    var s = 0;
    while (s < T.len) {
      var w = 16 + r() * 22, dep = 16 + r() * 22;
      var p = trackPoint(s + w / 2, 0);
      var off = side * (WALL + 3 + dep / 2 + r() * 5);
      var cx = p.x + Math.cos(p.heading) * 0 + (-Math.cos(p.heading)) * 0;
      var rxv = -Math.cos(p.heading), rzv = Math.sin(p.heading);   // sağ vektör (heading'den)
      cx = p.x + rxv * off; var cz = p.z + rzv * off;
      var yaw = p.heading;
      // köşeler yola çok yakınsa atla
      var ok = true, c = Math.cos(yaw), sn = Math.sin(yaw);
      var corners = [[-w / 2, -dep / 2], [w / 2, -dep / 2], [w / 2, dep / 2], [-w / 2, dep / 2], [0, 0], [0, -dep / 2], [0, dep / 2], [-w / 2, 0], [w / 2, 0]];
      for (var k = 0; k < corners.length && ok; k++) {
        var X = cx + corners[k][0] * c + corners[k][1] * sn, Z = cz - corners[k][0] * sn + corners[k][1] * c;
        if (distToTrack(X, Z) < WALL + 2.2) ok = false;
      }
      var rad = Math.hypot(w, dep) * 0.45;
      for (k = 0; k < placed.length && ok; k++) {
        if (Math.hypot(placed[k][0] - cx, placed[k][1] - cz) < rad + placed[k][2]) ok = false;
      }
      if (ok) {
        var kind = Math.floor(r() * 3);
        var downtown = Math.exp(-Math.pow(Math.hypot(cx - 250, cz + 150) / 320, 2));
        var h = 10 + r() * 25 + downtown * (30 + r() * 80);
        addBox(bufs[kind], cx, p.y - 12, cz, w, h + 12, dep, yaw, CELL[kind][0] * 16, CELL[kind][1] * 16);
        placed.push([cx, cz, rad]);
        if (r() < 0.22) neonSpots.push({ x: p.x + rxv * (off - side * (dep / 2 + 0.3)), y: p.y + 6 + r() * Math.min(10, h * 0.4), z: p.z + rzv * (off - side * (dep / 2 + 0.3)), heading: yaw, side: side, s: s + w / 2 });
        s += w + 1 + r() * 4;
      } else s += 6;
    }
  }
  var mats = [0, 1, 2].map(function (k) {
    var t = makeWindowTexture(k, 900 + k);
    return new THREE.MeshStandardMaterial({ map: t.map, emissiveMap: t.emissive, emissive: 0xffffff, emissiveIntensity: 1.5, roughness: k === 0 ? 0.35 : 0.8, metalness: k === 0 ? 0.3 : 0, side: THREE.DoubleSide });
  });
  for (var m = 0; m < 3; m++) world.add(new THREE.Mesh(bufs[m].build(), mats[m]));

  // uzak şehir silueti
  var far = new GeoBuf(), fr = rng(88);
  var cxm = (T.bounds[0] + T.bounds[1]) / 2, czm = (T.bounds[2] + T.bounds[3]) / 2;
  for (var f = 0; f < 70; f++) {
    var ang = fr() * 6.2832, dist = 900 + fr() * 700;
    addBox(far, cxm + Math.sin(ang) * dist, -20, czm + Math.cos(ang) * dist, 40 + fr() * 80, 60 + fr() * 260, 40 + fr() * 60, fr() * 3, 3.2 * 16, 3.4 * 16);
  }
  world.add(new THREE.Mesh(far.build(), mats[0]));
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshStandardMaterial({ color: 0x0c0d10, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(cxm, -9, czm);
  world.add(ground);
  return neonSpots;
}

function buildLampsAndNeons(neonSpots) {
  var T = TRACK, r = rng(55);
  var lamps = [];
  for (var s = 10, side = 1; s < T.len - 5; s += 34, side = -side) {
    var p = trackPoint(s, 0);
    lamps.push({ p: p, side: side });
  }
  var n = lamps.length, dummy = new THREE.Object3D();
  var poleG = new THREE.CylinderGeometry(0.09, 0.14, 8.6, 8); poleG.translate(0, 4.3, 0);
  var armG = new THREE.BoxGeometry(0.12, 0.12, 2.4); armG.translate(0, 8.5, 1.2);
  var headG = new THREE.BoxGeometry(0.45, 0.14, 0.9); headG.translate(0, 8.4, 2.3);
  var metal = new THREE.MeshStandardMaterial({ color: 0x3b3f45, roughness: 0.5, metalness: 0.6 });

  var heads = new THREE.InstancedMesh(headG, new THREE.MeshBasicMaterial({ color: 0xfff0d0 }), n);
  var poolMat = new THREE.MeshBasicMaterial({ map: TEX.pool, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffb468 });

  var streakMat = new THREE.MeshBasicMaterial({ map: TEX.streak, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffb870, opacity: 0.75 });
  var streakG = new THREE.PlaneGeometry(1.4, 16); streakG.rotateX(-Math.PI / 2);
  var streaks = new THREE.InstancedMesh(streakG, streakMat, n);
  var glowPos = [];
  for (var i = 0; i < n; i++) {
    var L = lamps[i], rx = -Math.cos(L.p.heading), rz = Math.sin(L.p.heading), off = L.side * (HW + 1.6);
    var px = L.p.x + rx * off, pz = L.p.z + rz * off;
    dummy.position.set(px, L.p.y + 0.16, pz);
    dummy.rotation.set(0, L.p.heading + (L.side > 0 ? Math.PI / 2 : -Math.PI / 2), 0);
    dummy.updateMatrix();
    poles.setMatrixAt(i, dummy.matrix); arms.setMatrixAt(i, dummy.matrix); heads.setMatrixAt(i, dummy.matrix);
    var hx = L.p.x + rx * (off - L.side * 2.3), hz = L.p.z + rz * (off - L.side * 2.3);
    glowPos.push(hx, L.p.y + 8.3, hz);
    dummy.position.set(hx, L.p.y + 0.04, hz); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
    pools.setMatrixAt(i, dummy.matrix);
    dummy.position.set(hx, L.p.y + 0.05, hz); dummy.rotation.set(0, L.p.heading, 0); dummy.updateMatrix();
    streaks.setMatrixAt(i, dummy.matrix);
  }
  [poles, arms, heads, pools, streaks].forEach(function (m) { m.instanceMatrix.needsUpdate = true; world.add(m); });
  pools.renderOrder = 2; streaks.renderOrder = 3;
  var gg = new THREE.BufferGeometry();
  gg.setAttribute('position', new THREE.Float32BufferAttribute(glowPos, 3));
  var glow = new THREE.Points(gg, new THREE.PointsMaterial({ map: TEX.glow, size: 7, sizeAttenuation: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffd9a8 }));
  glow.renderOrder = 4; world.add(glow);

  // neon tabelalar (uydurma isimler)
  var NEONS = [['GECE', '#ff3f8e', 'BAR'], ['OTO KUAFÖR', '#39d0ff', '7/24'], ['TURBO', '#ffb020', 'KAFE'], ['SAKARYA', '#7cff6b', 'MOTOR'],
    ['NEON 54', '#c86bff', null], ['LASTİK', '#ff5a36', 'BALANS'], ['KEBAP', '#ffd23a', 'SALONU'], ['OTEL', '#4fe3ff', 'YILDIZ']];
  var texCache = {};
  for (var k = 0; k < neonSpots.length; k++) {
    var sp = neonSpots[k], def = NEONS[k % NEONS.length];
    var key = def[0];
    if (!texCache[key]) texCache[key] = neonTex(def[0], def[1], def[2]);
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(9, 2.8), new THREE.MeshBasicMaterial({ map: texCache[key], transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
    mesh.position.set(sp.x, sp.y, sp.z);
    mesh.rotation.y = sp.heading + (sp.side > 0 ? Math.PI / 2 : -Math.PI / 2);
    mesh.renderOrder = 5;
    world.add(mesh);
    var pp = trackPoint(sp.s, sp.side * (HW - 1.5));
    var st = new THREE.Mesh(streakG, new THREE.MeshBasicMaterial({ map: TEX.streak, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: new THREE.Color(def[1]), opacity: 0.5 }));
    st.position.set(pp.x, pp.y + 0.06, pp.z); st.rotation.y = pp.heading; st.scale.set(2.2, 1, 1.2); st.renderOrder = 3;
    world.add(st);
  }
}

function makeCityEnv() {
  // 6 yüzlü, kodla çizilmiş gece şehri ortamı (her cihazda çalışır)
  var S = 128, faces = [], er = rng(31);
  var cols = ['#ffc27a', '#fff0d8', '#7fd0ff', '#ff4f9a', '#ffb040', '#9fe8ff'];
  for (var f = 0; f < 6; f++) {
    var c = mkCanvas(S, S), g = c.getContext('2d');
    if (f === 2) { g.fillStyle = '#56607e'; g.fillRect(0, 0, S, S); var gr0 = g.createRadialGradient(S / 2, S / 2, 4, S / 2, S / 2, S * 0.7); gr0.addColorStop(0, '#7a86a8'); gr0.addColorStop(1, '#3a4260'); g.fillStyle = gr0; g.fillRect(0, 0, S, S); }
    else if (f === 3) { g.fillStyle = '#3a2c22'; g.fillRect(0, 0, S, S); }
    else {
      var gr = g.createLinearGradient(0, 0, 0, S);
      gr.addColorStop(0, '#2a3352'); gr.addColorStop(0.42, '#5a4a5e'); gr.addColorStop(0.5, '#b07a4c'); gr.addColorStop(0.56, '#5a4234'); gr.addColorStop(1, '#2a2019');
      g.fillStyle = gr; g.fillRect(0, 0, S, S);
      for (var k = 0; k < 26; k++) {
        g.fillStyle = cols[Math.floor(er() * cols.length)];
        g.globalAlpha = 0.6 + er() * 0.4;
        g.fillRect(er() * S, S * (0.3 + er() * 0.22), 3 + er() * 12, 2 + er() * 6);
      }
      g.globalAlpha = 1;
    }
    faces.push(c);
  }
  var tex = new THREE.CubeTexture(faces);
  tex.encoding = THREE.sRGBEncoding;
  tex.needsUpdate = true;
  return tex;
}

  for (var k = 0; k < obstacles.length; k++) {

    var os = o.s !== undefined ? o.s : o.prog;

function pollPads() {

      if (n.cam && !p.cam) cycleCam(Math.min(j, players.length - 1));
    } else if (!plateOpen) {
      if (n.up && !p.up) menuMove(-1);
      if (n.down && !p.down) menuMove(1);
      if (n.left && !p.left) menuToggle(-1);
      if (n.right && !p.right) menuToggle(1);
      if ((n.ok && !p.ok) || (n.start && !p.start)) menuSelect();
      if (n.back && !p.back) goBack();

}

// ---------------- Dokunmatik ----------------
function toCanvas(t) { return { x: t.clientX * DPR, y: t.clientY * DPR }; }

function readTouches(list) {
  for (var i = 0; i < 2; i++) { var t0 = touchIn[i]; t0.left = t0.right = t0.gas = t0.brake = t0.hand = t0.nitro = false; }

    var p = toCanvas(list[i]), vi = 0;

    var v = views[vi] || { x: 0, y: 0, w: SW, h: SH }, L = touchLayout(v.w, v.h), lx = p.x - v.x, ly = p.y - v.y, t = touchIn[Math.min(vi, 1)];
    var hd = L.hand, nz = L.nitro;
    if (Math.hypot(lx - nz.x, ly - nz.y) < nz.r * 1.2) { t.nitro = true; continue; }
    if (Math.hypot(lx - hd.x, ly - hd.y) < hd.r * 1.25) { t.hand = true; continue; }
    if (lx < v.w * 0.42 && ly > v.h * 0.35) { if (steerMode === 0) { if (lx < (L.left.x + L.right.x) / 2) t.left = true; else t.right = true; } }
    else if (lx > v.w * 0.58 && ly > v.h * 0.3) {

}
glCanvas.addEventListener('touchstart', function (e) {
  e.preventDefault(); isTouch = true; initAudio();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var p = toCanvas(e.changedTouches[i]);
    if (isPadRacing()) {
      var tbp = topButtons();
      if (inRect(p, tbp.pause)) { padSend({ t: 'pause' }); continue; }
      if (tbp.cams[0] && inRect(p, tbp.cams[0])) { padSend({ t: 'cam' }); continue; }
    } else if (state === 'race' || state === 'countdown') {
      var tb = topButtons();
      if (inRect(p, tb.pause)) { pauseGame(); return; }
      for (var ci = 0; ci < tb.cams.length; ci++) if (inRect(p, tb.cams[ci])) cycleCam(tb.cams[ci].p);
    } else if (isMenuState()) {
      if (isGarageLike() && garageOk && inRect(p, garageOk)) { tapOk = true; tapStartItem = -1; continue; }
      var h = hitItem(p); tapStartItem = h ? h.i : -1;
      if (menu.listRect && inRect(p, menu.listRect)) listDrag = { y: p.y, scroll: menu.scroll, moved: false };
      if (isGarageLike() && garageView && inRect(p, garageView)) garageDrag = { x: p.x, spin: garageSpin };
    }
  }
  readTouches(e.touches);
}, { passive: false });
glCanvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  if (garageDrag && e.touches.length) { var p = toCanvas(e.touches[0]); garageSpin = garageDrag.spin + (p.x - garageDrag.x) / SW * 6; }
  if (listDrag && e.touches.length && menu.pitch) {
    var q = toCanvas(e.touches[0]), dy = q.y - listDrag.y;
    if (Math.abs(dy) > menu.pitch * 0.3) listDrag.moved = true;
    if (listDrag.moved) { menu.userScroll = true; menu.scroll = clamp(Math.round(listDrag.scroll - dy / menu.pitch), 0, Math.max(0, menu.count - menu.visible)); }
  }
  readTouches(e.touches);
}, { passive: false });
glCanvas.addEventListener('touchend', function (e) {
  e.preventDefault();
  var pe = toCanvas(e.changedTouches[0]);
  if (tapOk) { tapOk = false; if (isGarageLike() && garageOk && inRect(pe, garageOk)) { beep(620, 0.05, 'triangle', 0.05); if (state === 'pad') padSend({ t: 'start' }); else backToMenu(1); } }
  if (isMenuState() && tapStartItem >= 0 && !(listDrag && listDrag.moved)) {
    var h = hitItem(pe), items = menuItems();
    if (h && h.i === tapStartItem && items[h.i]) { initAudio(); menu.focus = h.i; menu.userScroll = true; items[h.i].a(pe.x < h.x + h.w * 0.35 ? -1 : 1); }
  }
  tapStartItem = -1;
  if (!e.touches.length) listDrag = null;
  if (!e.touches.length) garageDrag = null;
  readTouches(e.touches);
}, { passive: false });
glCanvas.addEventListener('touchcancel', function (e) { readTouches(e.touches); tapStartItem = -1; garageDrag = null; listDrag = null; tapOk = false; }, { passive: false });
var listDrag = null, tapOk = false;
glCanvas.addEventListener('wheel', function (e) {
  if (!isMenuState() || !menu.visible) return;
  e.preventDefault(); menu.userScroll = true;
  menu.scroll = clamp(menu.scroll + (e.deltaY > 0 ? 1 : -1), 0, Math.max(0, menu.count - menu.visible));

// telefonun geri hareketi: sayfadan çıkmak yerine bir önceki ekrana dön
var backGuard = false;
function guardBack() { if (backGuard || !isTouch) return; try { history.pushState({ gy: 1 }, ''); backGuard = true; } catch (e) {} }
window.addEventListener('popstate', function () {
  if (!backGuard) return;
  backGuard = false;
  if (plateOpen) { closePlateEditor(false); guardBack(); return; }
  if (state === 'menu') { try { history.back(); } catch (e) {} return; }
  if (state === 'race' || state === 'countdown') pauseGame(); else goBack();
  guardBack();
});
glCanvas.addEventListener('mousedown', function (e) {
  if (isTouch || state === 'loading') return;
  var p = toCanvas(e);
  if (isMenuState()) {
    var h = hitItem(p), items = menuItems();
    if (isGarageLike() && garageOk && inRect(p, garageOk)) { if (state === 'pad') padSend({ t: 'start' }); else backToMenu(1); return; }
    if (h && items[h.i]) { initAudio(); menu.focus = h.i; menu.userScroll = true; items[h.i].a(p.x < h.x + h.w * 0.35 ? -1 : 1); }

window.addEventListener('mousemove', function (e) { if (garageDrag && !isTouch) garageSpin = garageDrag.spin + (e.clientX * DPR - garageDrag.x) / SW * 6; });

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { pauseGame(); if (actx && actx.suspend) actx.suspend(); }
  else if (actx && actx.resume && soundOn) actx.resume();
});

// ---------------- Ekran boyutu ve kalite ----------------
var dynScale = 1, fpsAcc = 0, fpsN = 0, fpsGood = 0;
function adaptResolution(dt) {
  if (state !== 'race' && state !== 'countdown') { fpsAcc = 0; fpsN = 0; return; }
  fpsAcc += dt; fpsN++;
  if (fpsAcc < 1.5) return;
  var avg = fpsAcc / fpsN; fpsAcc = 0; fpsN = 0;
  if (avg > 1 / 45 && dynScale > 0.55) { dynScale = Math.max(0.55, dynScale * 0.85); fpsGood = 0; applyQuality(); }
  else if (avg < 1 / 58) { fpsGood++; if (fpsGood >= 4 && dynScale < 1) { dynScale = Math.min(1, dynScale * 1.1); fpsGood = 0; applyQuality(); } }
  else fpsGood = 0;
}
function applyQuality() {
  var cssW = window.innerWidth || 960, cssH = window.innerHeight || 540;
  var dpr = Math.min(window.devicePixelRatio || 1, hq ? (isTouch ? 1.35 : 1.75) : 1) * dynScale;
  var maxPix = (hq ? 1920 * 1080 : 1280 * 720) * dynScale * dynScale;
  if (cssW * cssH * dpr * dpr > maxPix) dpr = Math.sqrt(maxPix / (cssW * cssH));
  DPR = dpr;
  renderer.setPixelRatio(dpr);
  renderer.setSize(cssW, cssH, false);
  SW = glCanvas.width; SH = glCanvas.height;
  hud.width = SW; hud.height = SH;
  if (scene.fog) scene.fog.density = hq ? 0.0019 : 0.0026;
}
window.addEventListener('resize', applyQuality);

// ---------------- Ses güncellemesi ----------------
// ---------------- Döngü ----------------
var last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  var rawDt = (now - last) / 1000, dt = Math.min(0.05, rawDt); last = now;
  if (rawDt > 0 && rawDt < 0.5) adaptResolution(rawDt);
  if (state === 'loading') { drawHUD2D(dt); return; }
  pollPads();
  netUpdate(dt);
  if (state === 'pad') { render3D(dt); drawHUD2D(dt); return; }
  if (world.userData.update) world.userData.update(dt);
  if (state !== 'pause' && state !== 'garage') updateRace(dt);
  updateCarMeshes(dt);
  render3D(dt);
  drawHUD2D(dt);
  updateAudio(dt);
  if (state === 'menu' || state === 'settings' || state === 'lobby') autosaveSettings();
}

var loadTasks = null;
var loadI = 0;
function runLoad() {
  try {
    if (!loadTasks) loadTasks = [function () { applyQuality(); makeSidewalkTexture(); makeFxTextures(); }].concat(worldTasks()).concat([function () { toMenu(); }]);
    loadTasks[loadI++]();
  } catch (err) {
    state = 'loading'; loadProgress = 0;
    ctx.fillStyle = '#300'; ctx.fillRect(0, 0, SW, SH);
    txt('Hata: ' + err.message, 20, 40, 22, '#fff');
    console.error(err);
    return;
  }
  loadProgress = loadI / loadTasks.length;
  if (loadI < loadTasks.length) setTimeout(runLoad, 16);
  else { try { glCanvas.focus(); } catch (e) {} }
}
loadSave();
applySavedSettings();
applyQuality();
requestAnimationFrame(frame);
setTimeout(runLoad, 30);
window.__game = { playerName: function (p) { return playerName(p); }, endRaceNow: function () { endRace(); }, tt: { delta: function (p) { return ttDelta(p); }, ghostVisible: function () { return !!(ghost.mesh && ghost.mesh.visible); }, records: function () { return trackRecords(); } }, career: { get SAVE() { return SAVE; }, buyCar: buyCar, buyUpgrade: buyUpgrade, profileOf: profileOf, setMode: function (i) { modeIdx = i; }, get gameMode() { return gameMode; }, setDiff: function (d) { difficulty = d; }, get flash() { return flashMsg; } }, audio: function () { return { actx: actx, AUD: AUD, init: initAudio }; }, selectTrack: function (i) { trackIdx = (i - 1 + TRACKS.length) % TRACKS.length; selectTrack(1); }, get theme() { return THEME; }, setDiff: function (d) { difficulty = d; }, net: { NET: NET, startHost: startHost, openPadJoin: openPadJoin, padConnect: padConnect, padSend: padSend, choices: choices }, autoPilot: function (p) { return autoPilot(p); }, phys: { step: function (c, dt, i) { stepVehicle(c, dt, i); }, make: makeVehicle, setAssist: function (v) { assist = v; } }, scene: scene, renderer: renderer, THREE: THREE, DEBUG: DEBUG, place: function (i, s, off) { placeCarOnTrack(players[i], s, off); players[i].camPos = null; }, setCam: function (i, m) { players[i].camMode = m; players[i].camPos = null; }, setGIdx: function (i) { gIdx = i; }, get state() { return state; }, get players() { return players; }, get rivals() { return rivals; }, startRace: startRace, get track() { return TRACK; }, setState: function (s) { state = s; }, openGarage: openGarage, choices: choices, setNP: function (n) { numPlayers = n; } };
